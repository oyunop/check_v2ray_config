name: 🚀 订阅检测与同步 (Node.js 24 安全版)

on:
  schedule:
    - cron: '0 20 */3 * *'
  workflow_dispatch:

# 🛡️ 并发控制：如果新任务开始，自动取消上一个正在运行的任务，防止堆积
concurrency:
  group: subscription-checker
  cancel-in-progress: true

jobs:
  check-subscriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 🔻 Checkout 主仓库 (配置文件)
        uses: actions/checkout@v4

      - name: 🐳 运行 Subs-Check (带强杀机制)
        run: |
          echo "🚀 启动容器化检测任务..."
          timeout --signal=KILL --preserve-status 420 \
            docker run --rm \
              --name subs-check-run \
              -v "${{ github.workspace }}/config":/app/config \
              -v "${{ github.workspace }}/output":/app/output \
              ghcr.io/beck-8/subs-check:latest \
            || echo "🛑 任务结束：正常完成 或 已被超时强制终止"

          echo "⏳ 强制等待文件系统同步 (10秒)..."
          sleep 10

      - name: 📤 复制并推送 (仅变更提交)
        run: |  
          echo "🚚 开始同步文件到目标仓库..."

          # 2. 复制新生成的订阅文件
          # 注意：这里直接复制 output 下的所有内容，保持文件名纯净
          cp -rf ../output/* ./ || echo "📦 复制文件时出错，请检查上方日志"

          # 3. Git 提交逻辑
          git config user.email "action-bot@noreply.github.com"
          git config user.name "Subscription Bot"
          git add --all
          git commit -m "🤖 Auto Update: $(date '+%Y-%m-%d %H:%M') UTC"
          git push origin main
          echo "🎉 推送成功！今日任务彻底结束。"
